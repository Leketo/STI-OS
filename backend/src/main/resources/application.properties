spring.application.name=sti-os-backend
server.address=127.0.0.1
server.port=${STI_PORT:8080}
server.forward-headers-strategy=none
server.error.include-message=never
server.error.include-stacktrace=never
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=STI_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
spring.datasource.url=${STI_DB_URL}
spring.datasource.username=${STI_DB_USER}
spring.datasource.password=${STI_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.session.jdbc.initialize-schema=never
spring.session.jdbc.table-name=sti.spring_session
spring.sql.init.mode=never
spring.flyway.enabled=false
# Photos and signatures: private directory outside the web root, never served by Nginx.
sti.uploads.dir=${STI_UPLOADS_DIR:output/backend-local/uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
# Recovery mail (D-38, D-163). Every value but the password comes from the configuration; the password arrives as a
# credentials file, like the database ones. Without them the backend starts anyway and the queue says so.
# D-163: the server hands credentials as files (systemd LoadCredential): one file per name in CREDENTIALS_DIRECTORY,
# read as properties of that name. An environment variable of the same name stays as the local fallback.
spring.config.import=optional:configtree:${CREDENTIALS_DIRECTORY:/sin-credenciales}/
sti.mail.host=${STI_MAIL_HOST:}
sti.mail.port=${STI_MAIL_PORT:465}
sti.mail.username=${STI_MAIL_USERNAME:}
sti.mail.password=${STI_MAIL_PASSWORD:}
sti.mail.from=${STI_MAIL_FROM:}
sti.mail.public-url=${STI_PUBLIC_URL:}
# Rule 14, D-161: password checks at the same time. Optional; the value here is the default.
sti.auth.max-concurrent-checks=${STI_AUTH_MAX_CONCURRENT_CHECKS:4}
