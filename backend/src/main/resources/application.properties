spring.application.name=sti-os-backend
server.address=127.0.0.1
server.port=${STI_PORT:8080}
server.forward-headers-strategy=none
server.error.include-message=never
server.error.include-stacktrace=never
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=STI_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
spring.datasource.url=${STI_DB_URL}
spring.datasource.username=${STI_DB_USER}
spring.datasource.password=${STI_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.session.jdbc.initialize-schema=never
spring.session.jdbc.table-name=sti.spring_session
spring.sql.init.mode=never
spring.flyway.enabled=false
